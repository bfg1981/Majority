<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Majority Calculator – Governing Body Demo</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <h1>Governing body viewer</h1>
  <p>This demo loads a governing-body JSON and shows each group as a
selectable item. Clicking on an incomplete rule will allow you to see
possible ways to complete the rule.</p>

  <select id="governing-body-id"></select>
  <select id="governing-body-period"></select>

  <!-- Settings (introspected from CONFIG) -->
  <button id="gb-settings-gear" class="gb-gear" type="button" aria-label="Settings" aria-expanded="false">
    &#9881;
  </button>
  <div id="gb-settings-panel" class="gb-settings" role="dialog" aria-label="Settings" hidden>
    <div class="gb-settings-header">
      <div class="gb-settings-title">Settings</div>
      <button id="gb-settings-close" class="gb-settings-close" type="button" aria-label="Close settings">&times;</button>
    </div>
    <div id="gb-settings-body" class="gb-settings-body"></div>
  </div>


  <div id="governing-body-output"></div>

  <script>
    (async () => {
      function normalizeDeploymentInfo(data) {
        const version =
          data && typeof data.version === "string" && data.version
            ? data.version
            : null;
        return {
          version,
          devMode: Boolean(data && data.devMode),
        };
      }

      function withDevCacheBust(url, deploymentInfo) {
        if (!deploymentInfo.devMode || !deploymentInfo.version) return url;
        const u = new URL(url, window.location.href);
        u.searchParams.set("dev", deploymentInfo.version);
        return u.pathname + u.search + u.hash;
      }

      function loadScript(src, deploymentInfo, options = {}) {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          if (options.type) script.type = options.type;
          script.src = withDevCacheBust(src, deploymentInfo);
          script.onload = resolve;
          script.onerror = reject;
          document.body.appendChild(script);
        });
      }

      const deploymentInfo = await fetch("/deployment-version.json", {
        headers: { Accept: "application/json,*/*;q=0.8" },
      })
        .then((res) => (res.ok ? res.json() : null))
        .then(normalizeDeploymentInfo)
        .catch(() => normalizeDeploymentInfo(null));

      window.DEPLOYMENT_VERSION = deploymentInfo.version;
      window.DEV_MODE = deploymentInfo.devMode;
      window.GB_DEPLOYMENT_INFO = deploymentInfo;

      await loadScript("governing-body-viewer.js", deploymentInfo);
      await loadScript("app.js", deploymentInfo, { type: "module" });
    })();
  </script>

</body>
</html>
