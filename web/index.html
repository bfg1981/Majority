<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Majority Calculator – Governing Body Demo</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <h1>Governing body viewer</h1>
  <p>This demo loads a governing-body JSON and shows each group as a
selectable item. Clicking on an incomplete rule will allow you to see
possible ways to complete the rule.</p>

  <select id="governing-body-id"></select>
  <select id="governing-body-period"></select>

  <!-- Settings (introspected from CONFIG) -->
  <button id="gb-settings-gear" class="gb-gear" type="button" aria-label="Settings" aria-expanded="false">
    &#9881;
  </button>
  <div id="gb-settings-panel" class="gb-settings" role="dialog" aria-label="Settings" hidden>
    <div class="gb-settings-header">
      <div class="gb-settings-title">Settings</div>
      <button id="gb-settings-close" class="gb-settings-close" type="button" aria-label="Close settings">&times;</button>
    </div>
    <div id="gb-settings-body" class="gb-settings-body"></div>
  </div>


  <div id="governing-body-output"></div>

  <script src="governing-body-viewer.js"></script>

  <!-- INTEGRATED MANIFEST + DROPDOWN + LOADER LOGIC -->
  <script type="module">
    import { getManifest } from "./getManifest.js";

    const idSelect = document.getElementById("governing-body-id");
    const periodSelect = document.getElementById("governing-body-period");
    const outputId = "governing-body-output";

    // Settings UI (introspected from window.GB_CONFIG, defined in governing-body-viewer.js)
    const gearBtn = document.getElementById("gb-settings-gear");
    const settingsPanel = document.getElementById("gb-settings-panel");
    const settingsBody = document.getElementById("gb-settings-body");
    const settingsClose = document.getElementById("gb-settings-close");

    function clampNumber(n, min, max) {
      if (typeof min === "number" && Number.isFinite(min)) n = Math.max(min, n);
      if (typeof max === "number" && Number.isFinite(max)) n = Math.min(max, n);
      return n;
    }

    function buildControlRow(key, entry) {
      const row = document.createElement("div");
      row.className = "gb-setting-row";

      const label = document.createElement("label");
      label.className = "gb-setting-label";
      label.textContent = entry.label || key;

      const controlWrap = document.createElement("div");
      controlWrap.className = "gb-setting-control";

      const valueType = typeof entry.value;

      let input;
      if (valueType === "number") {
        input = document.createElement("input");
        input.type = "number";
        if (typeof entry.min === "number") input.min = String(entry.min);
        if (typeof entry.max === "number") input.max = String(entry.max);
        if (typeof entry.step === "number") input.step = String(entry.step);
        input.value = String(entry.value);
        input.addEventListener("change", () => {
          const parsed = Number(input.value);
          if (!Number.isFinite(parsed)) return;
          entry.value = clampNumber(parsed, entry.min, entry.max);
          input.value = String(entry.value);
        });
      } else if (valueType === "boolean") {
        input = document.createElement("input");
        input.type = "checkbox";
        input.checked = Boolean(entry.value);
        input.addEventListener("change", () => {
          entry.value = Boolean(input.checked);
        });
      } else {
        input = document.createElement("input");
        input.type = "text";
        input.value = String(entry.value ?? "");
        input.addEventListener("change", () => {
          entry.value = input.value;
        });
      }

      input.className = "gb-setting-input";
      const id = `gb-setting-${key}`;
      input.id = id;
      label.htmlFor = id;

      controlWrap.appendChild(input);
      row.appendChild(label);
      row.appendChild(controlWrap);

      return row;
    }

    function setupSettingsUI() {
      if (!gearBtn || !settingsPanel || !settingsBody || !settingsClose) return;
      const cfg = window.GB_CONFIG;
      if (!cfg || typeof cfg !== "object") return;

      // Build controls once from current CONFIG keys.
      settingsBody.innerHTML = "";
      for (const [key, entry] of Object.entries(cfg)) {
        if (!entry || typeof entry !== "object" || !("value" in entry)) continue;
        settingsBody.appendChild(buildControlRow(key, entry));
      }

      function openPanel() {
        settingsPanel.hidden = false;
        gearBtn.setAttribute("aria-expanded", "true");
      }

      function closePanel() {
        settingsPanel.hidden = true;
        gearBtn.setAttribute("aria-expanded", "false");
      }

      function togglePanel() {
        if (settingsPanel.hidden) openPanel();
        else closePanel();
      }

      gearBtn.addEventListener("click", togglePanel);
      settingsClose.addEventListener("click", closePanel);

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !settingsPanel.hidden) closePanel();
      });

      document.addEventListener("click", (e) => {
        if (settingsPanel.hidden) return;
        const t = e.target;
        if (t === gearBtn) return;
        if (settingsPanel.contains(t)) return;
        closePanel();
      });
    }


    const domReady = new Promise((resolve) => {
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", resolve, { once: true });
      } else {
        resolve();
      }
    });

    const manifestReady = new Promise((resolve) => {
      getManifest((manifest) => {
        resolve(manifest);
      });
    });

    Promise.all([domReady, manifestReady]).then(([, manifest]) => {
      setupSettingsUI();
      const ids = Object.keys(manifest);
      if (ids.length === 0) return;

      // Populate ID dropdown
      idSelect.innerHTML = "";
      for (const id of ids) {
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = id;
        idSelect.appendChild(opt);
      }

      //Disable if only one id
      idSelect.disabled = ids.length <= 1;

      let currentId = ids[0];
      let currentPeriod = null;

      function populatePeriods(preservePeriod = true) {
        const periods = Object.keys(manifest[currentId] || {});
        periodSelect.innerHTML = "";

        for (const p of periods) {
          const opt = document.createElement("option");
          opt.value = p;
          opt.textContent = p;
          periodSelect.appendChild(opt);
        }

        if (preservePeriod && currentPeriod && periods.includes(currentPeriod)) {
          periodSelect.value = currentPeriod;
        } else {
          currentPeriod = periods[periods.length - 1] || null;
          periodSelect.value = currentPeriod;
        }

        //Disable if only one id
        periodSelect.disabled = periods.length <= 1;
      }

      function loadCurrent() {
        if (!currentId || !currentPeriod) return;
        const file = manifest[currentId][currentPeriod];
        if (file) {
          loadGoverningBody(file, outputId);
        }
      }

      // Initial population + load
      populatePeriods(false);
      loadCurrent();

      idSelect.addEventListener("change", () => {
        const previousPeriod = currentPeriod;
        currentId = idSelect.value;
        currentPeriod = previousPeriod;
        populatePeriods(true);
        loadCurrent();
      });

      periodSelect.addEventListener("change", () => {
        currentPeriod = periodSelect.value;
        loadCurrent();
      });
    });
  </script>

</body>
</html>
